name: The Fixer final post-deploy Ollama check

# Automatic only when a deployment provider reports success to GitHub.
# Render/Cloudflare must publish deployment_status events for this to run.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newchanges-final-ollama-check
  cancel-in-progress: false

jobs:
  final-ollama-review:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.ref == 'main') }}
    runs-on: [self-hosted, linux, x64, newchanges-ci]
    timeout-minutes: 100
    steps:
      - name: Checkout trusted code only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify local Docker and Ollama model
        shell: bash
        run: |
          set -Eeuo pipefail
          docker info >/dev/null
          docker compose version
          docker run --rm --add-host host.docker.internal:host-gateway \
            curlimages/curl:latest -fsS --max-time 15 \
            http://host.docker.internal:11434/api/tags \
            | python3 -c 'import json,sys; m=json.load(sys.stdin)["models"]; assert any(x.get("name")=="qwen2.5-coder:7b" and not x.get("remote_host") for x in m), "Local model unavailable"'

      - name: Final AI security and anomaly review (advisory)
        id: review
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p test-reports/ai-security
          chmod 777 test-reports/ai-security
          docker compose -p "newchanges-ollama-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.ai-security.yml \
            run --build --rm ai-security-review

      - name: Generate remediation proposals (no automatic code changes)
        if: ${{ steps.review.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          docker compose -p "newchanges-ollama-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.ai-security.yml \
            run --rm --entrypoint python ai-security-review /scanner/ai-remediation-plan.py

      - name: Summarize check without publishing source excerpts
        if: always()
        shell: bash
        run: |
          echo "### Final post-deployment Ollama check" >> "$GITHUB_STEP_SUMMARY"
          echo "AI review: ${{ steps.review.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path("test-reports/ai-security/report.json")
          if p.exists():
              r=json.loads(p.read_text())
              print(f"Files selected: {r.get('reviewed_files', 0)}")
              print(f"Unverified findings: {len(r.get('findings', []))}")
              print(f"Scan errors: {len(r.get('errors', []))}")
          else:
              print("No report produced; check runner logs.")
          print("Remediation proposals need human review and regression testing.")
          PY

      - name: Clean up only this isolated scanner project
        if: always()
        shell: bash
        run: |
          docker compose -p "newchanges-ollama-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.ai-security.yml down --volumes --remove-orphans
