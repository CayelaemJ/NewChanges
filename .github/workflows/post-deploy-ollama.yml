name: The Fixer final post-deploy Ollama check

# Requires verified provider GitHub deployment_status reporting.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: newchanges-final-ollama-check
  cancel-in-progress: false

jobs:
  final-ollama-review:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment.ref == 'main' && contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state)) }}
    runs-on: [self-hosted, linux, x64, newchanges-ci]
    timeout-minutes: 360
    steps:
      - name: Verify scanner parser, chunk coverage and retries offline
        shell: bash
        run: python3 tests/ci/ollama-scanner-contract.test.py -v

      - name: Prepare private persistent local model checkpoint cache
        shell: bash
        run: install -d -m 700 "$HOME/.cache/the-fixer-ollama"

      - name: Checkout trusted main without stored credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify Docker and local Ollama
        shell: bash
        run: |
          set -Eeuo pipefail
          docker info >/dev/null
          docker compose version
          docker run --rm --add-host host.docker.internal:host-gateway \
            curlimages/curl:latest -fsS --max-time 15 \
            http://host.docker.internal:11434/api/tags \
            | python3 -c 'import json,sys; m=json.load(sys.stdin)["models"]; assert any(x.get("name")=="qwen2.5-coder:7b" and not x.get("remote_host") for x in m)'

      - name: Record deployment provider result
        id: provider
        shell: bash
        run: |
          echo "Provider state: ${{ github.event.deployment_status.state || 'manual' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment environment: ${{ github.event.deployment.environment || 'manual' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Observe Render and Cloudflare runtime health over deployment settling window
        id: health
        continue-on-error: true
        shell: bash
        env:
          FIXER_RENDER_BASE_URL: ${{ vars.FIXER_RENDER_BASE_URL }}
          FIXER_CLOUDFLARE_BASE_URL: ${{ vars.FIXER_CLOUDFLARE_BASE_URL }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/post-deploy-health.py

      - name: Post-deploy full repository deterministic security scan
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/ci/run-security-scanners.sh

      - name: Final AI security and anomaly review
        id: review
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p test-reports/ai-security
          docker compose -p "newchanges-ollama-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.ai-security.yml run --build --rm --user "$(id -u):$(id -g)" ai-security-review

      - name: Plan remediation (draft only)
        if: ${{ steps.review.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          docker compose -p "newchanges-ollama-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.ai-security.yml run --rm \
            --user "$(id -u):$(id -g)" --entrypoint python ai-security-review /scanner/ai-remediation-plan.py

      - name: Auto-repair only one low-risk UI finding
        if: ${{ steps.review.outcome == 'success' }}
        id: auto
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose -p "newchanges-ollama-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.ai-security.yml run --build --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint python ai-auto-repair /scanner/ai-auto-remediate.py

      - name: Verify strictly bounded patch with isolated dependency installation
        id: validate
        if: ${{ steps.auto.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          d=json.loads(Path("test-reports/ai-security/decision.json").read_text())
          if d.get("status")!="candidate":
              print("No automatic candidate, skipping validations")
              raise SystemExit(0)
          files=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          assert files==[d["file"]], "More than one changed source file"
          assert files[0].startswith("frontend/src/components/ui/"), "Unapproved patch path"
          changes=subprocess.check_output(["git","diff","--numstat"],text=True).split()
          assert len(changes)==3 and changes[0].isdigit() and changes[1].isdigit()
          assert int(changes[0])+int(changes[1])<=12, "Patch size limit exceeded"
          PY
          if [ "$(python3 -c 'import json;print(json.load(open("test-reports/ai-security/decision.json"))["status"])')" != "candidate" ]; then
            exit 0
          fi
          git diff --check
          # Use containerized Node on synthetic/local files; no database access or secrets.
          docker run --rm --network none -e CI=true \
            -v "$PWD:/workspace:rw" -w /workspace node:24-slim \
            sh -ec 'npm ci --offline --ignore-scripts --no-audit --no-fund && npm ci --prefix frontend --offline --ignore-scripts --no-audit --no-fund && npm run check:frontend:typecheck && npm run build --prefix frontend'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("test-reports/ai-security/decision.json")
          d=json.loads(p.read_text())
          if d["status"]=="candidate":
              d["status"]="validated"
              d["reason"]="Small UI patch passed offline typecheck and frontend build"
              p.write_text(json.dumps(d,indent=2))
          PY

      - name: Mark failed patch tests for approval
        if: ${{ steps.validate.outcome == 'failure' || steps.auto.outcome == 'failure' || steps.review.outcome == 'failure' || steps.static.outcome == 'failure' || steps.health.outcome == 'failure' || github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("test-reports/ai-security/decision.json")
          d=json.loads(p.read_text()) if p.exists() else {}
          d.update(status="escalate",reason="Local model or patch validation failed; no PR will be generated")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(d,indent=2))
          PY

      - name: Read decision for safe GitHub actions
        if: always()
        id: decision
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=Path("test-reports/ai-security/decision.json")
          d=json.loads(p.read_text()) if p.exists() else {"status":"escalate"}
          state=d.get("status","escalate")
          print("status="+(state if state in ("validated","escalate","no_action") else "escalate"))
          PY

      - name: Open PR for tested small fix (never merge automatically)
        if: ${{ steps.decision.outputs.status == 'validated' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/ollama-small-fix
          base: main
          title: 'fix: local Ollama low-risk UI remediation'
          body: |
            Automatic small-scope AI change after post-deployment review.
            Source was reviewed locally and frontend offline checks passed.
            AI findings remain unverified. Human review required before merge.
            This PR does not change authentication, MFA, databases or production.
          commit-message: 'fix: small Ollama-proposed UI correction'
          add-paths: |
            frontend/src/components/ui/**
          draft: true
          delete-branch: false

      - name: Notify owner for larger or unverified changes
        if: ${{ steps.decision.outputs.status == 'escalate' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = 'Ollama review requires approval (' + context.runId + ')';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: 'Post-deployment verification detected an unhealthy or unconfigured health target, a failed security scanner, or an issue outside the permitted AI small-fix scope.\n\nPlease review [the workflow run](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ').\n\nNo unreviewed code was merged or deployed. Findings are unverified and kept locally on the runner.'
            });

      - name: Store sanitized post-deploy health and check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newchanges-post-deploy-health-${{ github.run_id }}
          path: |
            test-reports/deployment/health.json
            test-reports/deployment/health.md
            test-results/security/scanner-status.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize
        if: always()
        shell: bash
        run: |
          echo "### Deployment verification: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Provider state: ${{ github.event.deployment_status.state || 'manual' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment commit: ${{ github.event.deployment.sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Health over 90-second observation window: ${{ steps.health.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-reports/deployment/health.md ]; then cat test-reports/deployment/health.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo "### Ollama and static security review" >> "$GITHUB_STEP_SUMMARY"
          echo "Static whole-repository scan: ${{ steps.static.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Scanner result: ${{ steps.review.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Auto-fix decision: ${{ steps.decision.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "AI proposals are unverified; no automatic production deployment or merge." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean only dedicated scanner containers
        if: always()
        shell: bash
        run: |
          docker compose -p "newchanges-ollama-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.ai-security.yml down --volumes --remove-orphans
