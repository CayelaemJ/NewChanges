name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with retained diagnostics
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-diagnostics
          path: ci-build.log
          if-no-files-found: ignore
      - run: npm run check:source-sync-safety
      - run: npm run check:semantic-planner
      - run: npm run check:semantic-storage
      - run: npm run check:source-vault
      - run: npm run check:source-continuity
      - run: npm run check:source-reconciliation
      - run: npm run check:production
      - run: npm run check:security
      - run: npm run check:ui
      - run: npm run check:imports
      - run: npm run check:scheduling
      - run: npm run check:daily-refresh
      - run: npm run test:score
      - run: npm run check:brand
      - run: npm run check:mlops
      - run: npm run check:mlops-data-quality
      - run: npm run check:accessibility
      - run: npm run check:performance
      - run: npm run check:security-identity
      - run: npm run check:security-operations
      - run: npm run check:role-perspective
      - run: npm run check:react
      - run: npm run check:security-governance
      - run: npm run check:south-africa-compliance
      - run: npm run check:period-comparison
      - run: npm audit --audit-level=high
