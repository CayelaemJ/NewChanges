name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile from declared dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Persist refreshed lockfile on branch pushes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: npm ci
      - run: npm run build
      - run: npm run check:production
      - run: npm run check:security
      - run: npm run check:ui
      - run: npm run check:imports
      - run: npm run check:scheduling
      - run: npm run test:score
      - run: npm audit --audit-level=high
