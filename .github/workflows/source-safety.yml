name: Source security and quality
# CircleCI runs automatic code-security checks for this repository.
# Keep this GitHub Actions workflow available for optional manual execution only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-safety-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret and static security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Semgrep
        run: pipx install semgrep
      - name: Scan JavaScript, TypeScript, and server code
        run: |
          semgrep scan --config p/javascript --config p/typescript --config p/security-audit --error --exclude node_modules --exclude dist --exclude build .

  source-quality:
    name: TypeScript, ESLint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install project dependencies
        run: npm ci && npm ci --prefix frontend --no-audit --no-fund && npm run db:generate
      - name: Install isolated quality tooling without changing project lockfile
        run: npm ls eslint @typescript-eslint/parser vitest @playwright/test
      - name: Lint source
        run: npm run quality:lint
      - name: Validate TypeScript
        run: npm run quality:types
      - name: Run unit smoke tests
        run: npm run quality:unit
  browser:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install project dependencies
        run: npm ci && npm ci --prefix frontend --no-audit --no-fund && npm run db:generate
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test homepage in Chromium
        run: npm run quality:e2e


