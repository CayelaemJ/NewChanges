name: Source security and quality
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-safety-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret and static security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Semgrep
        run: python -m pip install --user semgrep
      - name: Scan JavaScript, TypeScript, and server code
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan --config p/javascript --config p/typescript --config p/security-audit --error --exclude node_modules --exclude dist --exclude build .
