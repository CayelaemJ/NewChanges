name: NewChanges manual Docker CI (self-hosted only)

# Deliberately no push or pull_request triggers.
on:
  workflow_dispatch:
    inputs:
      run_security_scanners:
        description: 'Run security scans (Semgrep, Gitleaks, Trivy, secret checks, npm advisories; cached images needed)'
        required: false
        type: boolean
        default: true
      prepare_mfa_lock:
        description: 'Resolve SimpleWebAuthn 14.0.3 lockfile (uploads files; no push or deployment)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: newchanges-manual-docker-ci
  cancel-in-progress: false

jobs:
  docker-tests:
    # Dedicated personal runner. Execute only after reviewing the selected branch.
    runs-on: [self-hosted, linux, x64, newchanges-ci]
    timeout-minutes: 360
    env:
      CI: "true"
      NODE_ENV: test
    steps:
      - name: Verify scanner parser, chunk coverage and retries offline
        shell: bash
        run: python3 tests/ci/ollama-scanner-contract.test.py -v

      - name: Prepare private persistent local model checkpoint cache
        shell: bash
        run: install -d -m 700 "$HOME/.cache/the-fixer-ollama"

      - name: Check out selected trusted ref without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare real WebAuthn package and lockfile (opt in only)
        if: ${{ inputs.prepare_mfa_lock == true }}
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/workspace" -w /workspace node:24-slim npm install --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund @simplewebauthn/server@14.0.3
          git diff --check

      - name: Upload lockfile for reviewed commit
        if: ${{ inputs.prepare_mfa_lock == true }}
        uses: actions/upload-artifact@v4
        with:
          name: newchanges-mfa-locked-dependency-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Confirm expected local test assets are present
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docker-compose.local-tests.yml || { echo "Missing docker-compose.local-tests.yml. Commit the local Docker test setup to the selected branch first."; exit 1; }
          test -f Dockerfile.test || { echo "Missing Dockerfile.test. Commit the local Docker test setup to the selected branch first."; exit 1; }
          test -f scripts/ci/run-docker-ci-suite.sh || { echo "Missing shared CI suite"; exit 1; }
          docker compose -f docker-compose.local-tests.yml config --quiet
          docker info >/dev/null
          docker compose version

      - name: Ensure complete history for credential scans
        shell: bash
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false || { echo 'Shallow checkout: refusing incomplete history scan'; exit 1; }

      - name: Validate CI isolation contracts
        shell: bash
        run: |
          docker run --rm --network none --read-only \
            -v "$PWD:/workspace:ro" -w /workspace node:24-slim \
            node --test tests/ci-docker-isolation.test.mjs tests/ci/test-suite-coverage-contract.test.mjs

      - name: Build and run synthetic Docker tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose -p "newchanges-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.local-tests.yml \
            run --build --rm tests sh scripts/ci/run-docker-ci-suite.sh

      - name: Rehearse committed Prisma migrations in a second disposable database
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT="newchanges-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker compose -p "$PROJECT" -f docker-compose.local-tests.yml \
            exec -T db createdb -U ci_fixture newchanges_ci_migrations
          docker compose -p "$PROJECT" -f docker-compose.local-tests.yml \
            run --rm --no-deps \
              -e DATABASE_URL=postgresql://ci_fixture:ci_fixture@127.0.0.1:5432/newchanges_ci_migrations \
              tests sh -ceu '
                test "$CI" = "true"
                test "$DATABASE_URL" = "postgresql://ci_fixture:ci_fixture@127.0.0.1:5432/newchanges_ci_migrations"
                node node_modules/prisma/build/index.js migrate deploy
                node node_modules/prisma/build/index.js migrate status
                echo "PASS isolated Prisma migration deploy and status"
              '

      - name: Drop temporary migration rehearsal database
        if: always()
        shell: bash
        run: |
          PROJECT="newchanges-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker compose -p "$PROJECT" -f docker-compose.local-tests.yml \
            exec -T db dropdb -U ci_fixture --if-exists --force newchanges_ci_migrations || true

      - name: Verify disposable PostgreSQL backup and restore
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose -p "newchanges-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.local-tests.yml exec -T db sh -ceu '
              test "$POSTGRES_DB" = "newchanges_ci"
              test "$POSTGRES_USER" = "ci_fixture"
              trap "dropdb -U ci_fixture --if-exists --force newchanges_ci_restore >/dev/null 2>&1 || true; rm -f /tmp/ci-backup.dump" EXIT
              pg_dump -U ci_fixture -d newchanges_ci -Fc -f /tmp/ci-backup.dump
              createdb -U ci_fixture newchanges_ci_restore
              pg_restore -U ci_fixture -d newchanges_ci_restore --no-owner --no-acl --exit-on-error /tmp/ci-backup.dump
              original=$(psql -U ci_fixture -d newchanges_ci -tA -c "SELECT count(*) FROM pg_tables WHERE schemaname=current_schema()")
              restored=$(psql -U ci_fixture -d newchanges_ci_restore -tA -c "SELECT count(*) FROM pg_tables WHERE schemaname=current_schema()")
              test "$original" -ge 20
              test "$original" = "$restored"
              echo "PASS disposable pg_dump/pg_restore: $original public tables matched"
            '

      - name: Security scanners (requires pre-cached images and advisory access)
        if: ${{ always() && inputs.run_security_scanners == true }}
        shell: bash
        run: bash scripts/ci/run-security-scanners.sh

      - name: Run resumable Ollama security review of all reviewable tracked files
        if: ${{ always() && !inputs.prepare_mfa_lock }}
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p test-reports/ai-security
          docker compose -p "newchanges-preaudit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.ai-security.yml run --build --rm \
            --user "$(id -u):$(id -g)" ai-security-review

      - name: Summarize pre-release AI coverage
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path("test-reports/ai-security/report.json")
          if p.exists():
              d=json.loads(p.read_text())
              print(f"Pre-release AI reviewed {d.get('reviewed_files',0)}/{d.get('eligible_files',0)} eligible files; complete={d.get('complete',False)}")
          else:
              print("Pre-release AI did not produce a report; not a complete AI audit")
          PY

      - name: Upload safe security status report
        if: ${{ always() && inputs.run_security_scanners == true }}
        uses: actions/upload-artifact@v4
        with:
          name: newchanges-security-status-${{ github.run_id }}
          path: test-results/security/scanner-status.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Extract isolated Docker test evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p test-results
          PROJECT="newchanges-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VOLUME="${PROJECT}_test-artifacts"
          if docker volume inspect "$VOLUME" >/dev/null 2>&1; then
            docker run --rm --network none \
              -v "$VOLUME:/reports:ro" -v "$PWD/test-results:/output" \
              --entrypoint sh node:24-slim \
              -c 'cp -R /reports/. /output/'
          fi

      - name: Upload test failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: newchanges-docker-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up only this CI test project
        if: always()
        shell: bash
        run: |
          docker compose -p "newchanges-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.local-tests.yml \
            down --volumes --remove-orphans
          docker compose -p "newchanges-preaudit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.ai-security.yml down --volumes --remove-orphans
