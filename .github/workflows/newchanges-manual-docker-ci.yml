name: NewChanges manual Docker CI (self-hosted only)

# Deliberately no push or pull_request triggers.
on:
  workflow_dispatch:
    inputs:
      run_security_scanners:
        description: 'Opt in to pre-cached security scanners (Semgrep, Gitleaks, Trivy, npm advisory)'
        required: false
        type: boolean
        default: false
      prepare_mfa_lock:
        description: 'Resolve SimpleWebAuthn 14.0.3 lockfile (uploads files; no push or deployment)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: newchanges-manual-docker-ci
  cancel-in-progress: false

jobs:
  docker-tests:
    # Dedicated personal runner. Execute only after reviewing the selected branch.
    runs-on: [self-hosted, linux, x64, newchanges-ci]
    timeout-minutes: 90
    env:
      CI: "true"
      NODE_ENV: test
    steps:
      - name: Check out selected trusted ref without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Confirm expected local test assets are present
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f docker-compose.local-tests.yml || { echo "Missing docker-compose.local-tests.yml. Commit the local Docker test setup to the selected branch first."; exit 1; }
          test -f Dockerfile.test || { echo "Missing Dockerfile.test. Commit the local Docker test setup to the selected branch first."; exit 1; }
          test -f scripts/ci/run-docker-ci-suite.sh || { echo "Missing shared CI suite"; exit 1; }
          docker compose -f docker-compose.local-tests.yml config --quiet
          docker info >/dev/null
          docker compose version

      - name: Ensure complete history for credential scans
        shell: bash
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false || { echo 'Shallow checkout: refusing incomplete history scan'; exit 1; }

      - name: Validate CI isolation contracts
        shell: bash
        run: |
          docker run --rm --network none --read-only \
            -v "$PWD:/workspace:ro" -w /workspace node:24-slim \
            node --test tests/ci-docker-isolation.test.mjs

      - name: Optional security scanners (requires pre-cached images and advisory access)
        if: ${{ inputs.run_security_scanners == true }}
        shell: bash
        run: bash scripts/ci/run-security-scanners.sh

      - name: Build and run synthetic Docker tests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose -p "newchanges-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.local-tests.yml \
            run --build --rm tests sh scripts/ci/run-docker-ci-suite.sh

      - name: Clean up only this CI test project
        if: always()
        shell: bash
        run: |
          docker compose -p "newchanges-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f docker-compose.local-tests.yml \
            down --volumes --remove-orphans
