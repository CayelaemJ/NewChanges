services:
  ai-security-review:
    build:
      context: .
      dockerfile: Dockerfile.ai-security
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
      SCAN_ROOT: /workspace
      REPORT_DIR: /reports
      MAX_FILES: "25"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/workspace:ro
      - ./test-reports/ai-security:/reports:rw
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    network_mode: bridge
