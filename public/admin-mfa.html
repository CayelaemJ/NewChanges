<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administrator MFA | The Fixer</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#f7f4fc,#eef4f8);font:15px system-ui,sans-serif;color:#17243a}main{width:min(100%,500px);background:#fff;border:1px solid #ddd8e8;border-radius:20px;padding:32px;box-shadow:0 18px 60px #1c17451a}.brand{font-weight:800;color:#2b1b68}h1{margin:20px 0 8px;color:#2b1b68;font-size:28px}p{line-height:1.55;color:#526278}label{display:block;margin:20px 0 7px;font-weight:700}input{width:100%;padding:13px;border:1px solid #b8b4c5;border-radius:10px;font:inherit}button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:#2b1b68;color:white;font:700 15px system-ui;cursor:pointer}button:disabled{opacity:.6;cursor:wait}pre{white-space:pre-wrap;word-break:break-all;background:#f4f1f9;border-radius:8px;padding:10px;color:#34215f}.error{color:#a32323}.hidden{display:none}.notice{margin-top:16px;padding:13px;border-radius:10px;background:#f4f1f9}</style></head>
<body><main><div class="brand">THE FIXER</div><h1 id="title">Administrator verification</h1><p id="intro">Enter the code from your authenticator app to continue.</p><div id="error" class="error" role="alert" aria-live="polite"></div>
<section id="setup" class="hidden"><p id="setup-intro">Confirm your password to generate a setup key.</p><label for="password">Current password</label><input id="password" type="password" autocomplete="current-password"><button id="start-setup">Start MFA setup</button><div id="secret-wrap" class="hidden"><p>Enter this setup key in your authenticator app. Keep it private.</p><label for="secret">Setup key</label><pre id="secret"></pre><label for="setup-code">Six-digit verification code</label><input id="setup-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><button id="confirm">Confirm and enable MFA</button></div></section>
<section id="verify" class="hidden"><label for="code">Authenticator or recovery code</label><input id="code" autocomplete="one-time-code" maxlength="24"><button id="verify-button">Verify and continue</button></section>
<section id="recovery" class="hidden notice"><h2>Save your recovery codes</h2><p>Each code works once and will not be shown again.</p><pre id="recovery-codes"></pre><button id="continue">I saved these codes</button></section></main><script src="/static/admin-mfa.js?v=1" defer></script></body></html>
