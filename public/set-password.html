<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');
  :root{--blue:#b15be8;--blue-d:#8e42bd;--brand-primary:#32217c;--line:#e8e1f7;--ink:#0f2438;--grey:#5b6b7a;--green:#1fa463;--green-soft:#e7f7ef;--red:#e0492f;--red-soft:#fdecea;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:radial-gradient(1100px 560px at 80% -10%,rgba(0,120,199,.10),transparent 60%),#f3f7fb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 40px rgba(13,42,71,.10);width:100%;max-width:400px;padding:40px 36px;}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.4px;color:var(--brand-primary);text-align:center;}
  .logo .o{color:var(--blue);}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:23px;color:var(--brand-primary);text-align:center;margin:22px 0 4px;}
  .sub{text-align:center;color:var(--grey);font-size:13.5px;margin-bottom:22px;}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--brand-primary);margin:14px 0 6px;}
  input{width:100%;font-family:inherit;font-size:14px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fafcfe;}
  input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(0,120,199,.12);}
  button{width:100%;margin-top:22px;font-family:inherit;font-weight:700;font-size:14px;color:#fff;background:var(--brand-primary);border:none;border-radius:11px;padding:13px;cursor:pointer;}
  button:hover{background:var(--blue-d);}
  .msg{display:none;font-size:13px;font-weight:600;padding:11px 14px;border-radius:11px;margin-top:18px;}
  .msg.err{background:var(--red-soft);color:#b5391f;}
  .msg.ok{background:var(--green-soft);color:#137a47;}
</style>
<link rel="stylesheet" href="/static/enterprise.css?v=2">
  <link rel="stylesheet" href="/static/enterprise-v3.css?v=4">
<link rel="stylesheet" href="/static/the-fixer-brand.css?v=4">
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/static/the-fixer-logo.svg?v=6" class="efs-brand-logo" alt="The Fixer" style="height:48px;width:auto;"></div>
    <h1>Set your password</h1>
    <div class="sub">Choose a password to activate your account</div>
    <label for="p1">New password</label>
    <input id="p1" type="password" placeholder="12+ characters, upper-case, lower-case and a number">
    <label for="p2">Confirm password</label>
    <input id="p2" type="password" placeholder="re-enter password">
    <button id="btn" onclick="submit()">Set password & continue</button>
    <div class="msg" id="msg"></div>
  </div>
<script>
const $=s=>document.querySelector(s);
const token=new URLSearchParams(location.search).get('token');
if(!token){ const m=$('#msg'); m.className='msg err'; m.textContent='This link is missing its token. Ask your administrator to resend it.'; m.style.display='block'; $('#btn').disabled=true; }
async function submit(){
  const m=$('#msg'); m.style.display='none';
  const p1=$('#p1').value, p2=$('#p2').value;
  if(p1.length<12 || !/[A-Z]/.test(p1) || !/[a-z]/.test(p1) || !/[0-9]/.test(p1)){ show('err','Use at least 12 characters with upper-case, lower-case and a number.'); return; }
  if(p1!==p2){ show('err','Passwords do not match.'); return; }
  const r=await fetch('/api/auth/set-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p1})});
  const d=await r.json();
  if(!r.ok){ show('err',d.error||'Could not set password.'); return; }
  show('ok','Password set! Redirecting to sign in…');
  setTimeout(()=>location.href='/login',1600);
}
function show(t,msg){ const m=$('#msg'); m.className='msg '+t; m.textContent=msg; m.style.display='block'; }
</script>
<script src="/static/shell.js?v=1"></script>
</body>
