version: 2.1

# CI independent of GitHub-hosted Actions billing.
# Connect this private GitHub repository to CircleCI (free plan) to activate.
jobs:
  admin_browser_smoke:
    docker:
      - image: mcr.microsoft.com/playwright:v1.56.1-noble
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Chromium Admin Console smoke test
          command: |
            mkdir -p test-results/admin-browser
            set -o pipefail
            node --version | tee test-results/admin-browser/environment.log
            npm --version | tee -a test-results/admin-browser/environment.log
            npm ci --no-audit --no-fund 2>&1 | tee test-results/admin-browser/install.log
            npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 2>&1 | tee -a test-results/admin-browser/install.log
            node scripts/admin-browser-smoke.mjs 2>&1 | tee test-results/admin-browser/browser.log
          no_output_timeout: 10m
      - store_artifacts:
          path: test-results/admin-browser
          destination: admin-browser
          when: always
  verify:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Generate Prisma and build backend and frontend
          command: npm run build
          no_output_timeout: 10m
      - run:
          name: Semantic integration and source safeguards
          command: |
            npm run check:contract
            npm run check:neon-egress
            npm run check:source-sync-safety
            npm run check:admin-ui
            node scripts/admin-refresh-clarity-check.mjs
            node scripts/dataset-replacement-preview-check.mjs
            npx tsx tests/dataset-replacement-approval.test.ts
            npx tsx tests/dataset-replacement-feed-budget.test.ts
            npx tsx tests/dataset-replacement-staging.test.ts
            npx tsx tests/dataset-replacement-staging-plan.test.ts
            npx tsx tests/dataset-replacement-object-integrity.test.ts
            npx tsx tests/dataset-replacement-manifest-review.test.ts
            npx tsx tests/dataset-replacement-storage-review.test.ts
            node scripts/replacement-dependency-audit-check.mjs
            npx tsx tests/semantic-shadow-provenance.test.ts
            npm run check:semantic-planner
            node scripts/semantic-queue-batch-check.mjs
            npm run check:semantic-storage
            npm run check:source-vault
            npm run check:source-continuity
            npm run check:source-reconciliation
      - run:
          name: API, data and dashboard regressions
          command: |
            npm run check:production
            npm run check:security
            npm run check:ui
            npm run check:imports
            npm run check:scheduling
            npm run check:daily-refresh
            npm run check:enterprise-operations
            npm run check:unified-data-ingestion
            npm run check:enterprise-analytics-phase-2
            npm run check:react
            npm run check:role-perspective
      - run:
          name: Data quality, platform and UI tests
          command: |
            npm run test:score
            npm run check:brand
            npm run check:mlops
            npm run check:mlops-data-quality
            npm run check:accessibility
            npm run check:performance
            npm run check:security-identity
            npm run check:security-operations
            npm run check:security-governance
            npm run check:south-africa-compliance
            npm run check:period-comparison
      - run:
          name: Dependency vulnerability audit
          command: npm audit --audit-level=high
      - store_test_results:
          path: test-results
          when: always

  source_quality:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Install app and frontend dependencies
          command: npm ci --no-audit --no-fund && npm install --prefix frontend --no-audit --no-fund
      - run:
          name: Install standalone quality tooling
          command: npm install --no-save --package-lock=false --no-audit --no-fund eslint@^9 @eslint/js@^9 globals@^16 @typescript-eslint/parser@^8 vitest@^3 @playwright/test@^1
      - run:
          name: ESLint
          command: npm run quality:lint
      - run:
          name: TypeScript
          command: npm run quality:types
      - run:
          name: Vitest unit tests
          command: npm run quality:unit

  browser_smoke:
    docker:
      - image: mcr.microsoft.com/playwright:v1.56.1-noble
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Install app and frontend dependencies
          command: npm ci --no-audit --no-fund && npm install --prefix frontend --no-audit --no-fund
      - run:
          name: Install Playwright
          command: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
      - run:
          name: Browser smoke test in Chromium
          command: npm run quality:e2e
      - store_artifacts:
          path: test-results
          destination: browser-smoke

  semgrep_security:
    docker:
      - image: python:3.12-slim
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Install Semgrep
          command: pip install --no-cache-dir semgrep
      - run:
          name: Scan JavaScript, TypeScript and security rules
          command: semgrep scan --config p/javascript --config p/typescript --config p/security-audit --error --exclude node_modules --exclude dist --exclude build .

  secrets_scan:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Scan tracked source for leaked secrets (Gitleaks)
          command: |
            set -euo pipefail
            VERSION=8.24.3
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
            mkdir -p /tmp/gitleaks-bin
            tar -xzf /tmp/gitleaks.tgz -C /tmp/gitleaks-bin gitleaks
            /tmp/gitleaks-bin/gitleaks dir --redact --exit-code 1 .

  trivy_scan:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Trivy dependency and config scanning
          command: |
            set -euo pipefail
            curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh -o /tmp/trivy-install.sh
            sh /tmp/trivy-install.sh -b /tmp v0.76.0
            /tmp/trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules --skip-dirs dist .

  postgres_schema:
    docker:
      - image: cimg/node:22.14
        environment:
          DATABASE_URL: postgresql://circleci:circleci@localhost:5432/ci_validation?schema=public
      - image: cimg/postgres:16.6
        environment:
          POSTGRES_USER: circleci
          POSTGRES_PASSWORD: circleci
          POSTGRES_DB: ci_validation
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install app dependencies and generate Prisma
          command: npm ci --no-audit --no-fund && npx prisma generate
      - run:
          name: Validate isolated PostgreSQL schema
          command: |
            set -euo pipefail
            npx prisma validate
            for i in $(seq 1 30); do
              if node -e 'const n=require("net").connect(5432,"127.0.0.1"); n.on("connect",()=>process.exit(0));n.on("error",()=>process.exit(1))'; then break; fi
              sleep 2
            done
            npx prisma db push --skip-generate
            npx prisma db pull --print > /tmp/verified-prisma-schema.prisma

  railway_health:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Read-only Railway health endpoint verification
          command: |
            set -euo pipefail
            if [ -z "${RAILWAY_HEALTH_URL:-}" ]; then
              echo "SKIPPED: configure RAILWAY_HEALTH_URL for the deployed application's health endpoint"
              exit 0
            fi
            case "$RAILWAY_HEALTH_URL" in https://*) ;; *) echo "Only HTTPS health URLs are allowed"; exit 1;; esac
            curl --fail --silent --show-error --location --max-time 20 --retry 3 "$RAILWAY_HEALTH_URL" > /dev/null

workflows:
  verify_pull_requests_and_main:
    jobs:
      - verify
      - admin_browser_smoke
      - source_quality
      - browser_smoke
      - semgrep_security
      - secrets_scan
      - trivy_scan
      - postgres_schema
      - railway_health:
          filters:
            branches:
              only: main
