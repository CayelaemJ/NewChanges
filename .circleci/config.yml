version: 2.1

# Explicit manual opt-in; NEVER runs against a database on ordinary PR pushes.
parameters:
  semantic_context_readiness:
    type: boolean
    default: false
  semantic_testing_e2e:
    type: boolean
    default: false
  semantic_notify_probe:
    type: boolean
    default: false

# CI independent of GitHub-hosted Actions billing.
# Connect this private GitHub repository to CircleCI (free plan) to activate.
# Reusable native CircleCI deployment marker.
# Invoke this command *after* a real Railway deployment has succeeded, from
# the job that performs or verifies the deploy. Never mark CI success as a deploy.
commands:
  record_railway_deploy:
    description: Record an actual successful Railway deployment in CircleCI Deploys.
    parameters:
      environment:
        type: string
      component:
        type: string
        default: newchanges
    steps:
      - run:
          name: Record successful Railway deployment marker
          command: |
            : "${CIRCLE_SHA1:?CircleCI commit SHA is required}"
            circleci run release log \
              --environment-name="<< parameters.environment >>" \
              --component-name="<< parameters.component >>" \
              --target-version="$CIRCLE_SHA1"

jobs:
  semantic_testing_context_readiness:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Require restricted context and isolated feature branch
          command: |
            set -eu
            if [ "<< pipeline.parameters.semantic_context_readiness >>" != "true" ] || [ "<< pipeline.parameters.semantic_notify_probe >>" = "true" ] || [ "<< pipeline.parameters.semantic_testing_e2e >>" = "true" ]; then
              echo "Refusing concurrent or incorrectly scoped semantic Testing workflows."
              exit 1
            fi
            if [ "${CIRCLE_BRANCH:-}" != "fix/semantic-refresh-period-validation-20261019" ]; then
              echo "Refusing context readiness outside isolated feature branch."
              exit 1
            fi
            if [ -z "${SEMANTIC_TESTING_DATABASE_URL:-}" ] || [ -z "${SEMANTIC_LISTEN_DATABASE_URL:-}" ]; then
              echo "Restricted Testing context requires both pooled and direct Neon connection secrets."
              exit 1
            fi
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Verify both Neon Testing connections and synthetic fixtures read-only
          command: |
            set -eu
            export DATABASE_URL="${SEMANTIC_TESTING_DATABASE_URL}"
            export SEMANTIC_SYNTHETIC_E2E_APPROVED=YES_TEST_ONLY
            npm run semantic:e2e:context-readiness

  semantic_testing_notify_probe:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Require isolated Neon Testing credentials and feature branch
          command: |
            set -eu
            if [ "<< pipeline.parameters.semantic_notify_probe >>" != "true" ] || [ "<< pipeline.parameters.semantic_context_readiness >>" = "true" ] || [ "<< pipeline.parameters.semantic_testing_e2e >>" = "true" ]; then
              echo "Refusing concurrent or incorrectly scoped semantic Testing workflows."
              exit 1
            fi
            if [ -z "${SEMANTIC_TESTING_DATABASE_URL:-}" ] || [ -z "${SEMANTIC_LISTEN_DATABASE_URL:-}" ]; then
              echo "Isolated Testing pooled and direct listener secrets are both required; refusing probe."
              exit 1
            fi
            if [ "${CIRCLE_BRANCH:-}" != "fix/semantic-refresh-period-validation-20261019" ]; then
              echo "Isolated LISTEN/NOTIFY probe refuses other branches."
              exit 1
            fi
      - run:
          name: Install locked packages without provisioning services
          command: npm ci --no-audit --no-fund
      - run:
          name: Measure three short-lived Neon Testing notification deliveries
          command: |
            set -eu
            export DATABASE_URL="${SEMANTIC_TESTING_DATABASE_URL}"
            export SEMANTIC_SYNTHETIC_E2E_APPROVED=YES_TEST_ONLY
            export SEMANTIC_NOTIFY_PROBE_APPROVED=YES_TEST_ONLY
            npm run semantic:e2e:notify-probe

  semantic_testing_score_delta:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Require dedicated isolated Neon Testing secret
          command: |
            set -eu
            if [ "<< pipeline.parameters.semantic_testing_e2e >>" != "true" ] || [ "<< pipeline.parameters.semantic_context_readiness >>" = "true" ] || [ "<< pipeline.parameters.semantic_notify_probe >>" = "true" ]; then
              echo "Refusing concurrent or incorrectly scoped semantic Testing workflows."
              exit 1
            fi
            if [ -z "${SEMANTIC_TESTING_DATABASE_URL:-}" ] || [ -z "${SEMANTIC_LISTEN_DATABASE_URL:-}" ]; then
              echo "Both pooled and direct restricted Neon Testing connection secrets are required; refusing E2E."
              exit 1
            fi
            if [ "${RAILWAY_ENVIRONMENT_NAME:-}" = "Production" ]; then
              echo "Refusing to run synthetic E2E in a production environment."
              exit 1
            fi
            if [ "${CIRCLE_BRANCH:-}" != "fix/semantic-refresh-period-validation-20261019" ]; then
              echo "Refusing synthetic E2E outside its isolated feature branch."
              exit 1
            fi
      - run:
          name: Install application dependencies for isolated Testing
          command: npm ci --no-audit --no-fund && npx prisma generate
      - run:
          name: Execute and restore isolated Neon synthetic score delta
          command: |
            set -eu
            export DATABASE_URL="${SEMANTIC_TESTING_DATABASE_URL}"
            export SEMANTIC_SYNTHETIC_E2E_APPROVED=YES_TEST_ONLY
            export ENABLE_SEMANTIC_SHADOW_WORKER=false
            export ENABLE_SEMANTIC_OBJECT_PUBLISH=false
            npm run semantic:e2e:suite

  admin_browser_smoke:
    docker:
      - image: mcr.microsoft.com/playwright:v1.64.1-noble
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Chromium Admin Console smoke test
          command: |
            mkdir -p test-results/admin-browser
            set -o pipefail
            node --version | tee test-results/admin-browser/environment.log
            npm --version | tee -a test-results/admin-browser/environment.log
            npm ci --no-audit --no-fund 2>&1 | tee test-results/admin-browser/install.log
            npm run db:generate 2>&1 | tee -a test-results/admin-browser/install.log
            npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.64.1 2>&1 | tee -a test-results/admin-browser/install.log
            node scripts/admin-browser-smoke.mjs 2>&1 | tee test-results/admin-browser/browser.log
          no_output_timeout: 10m
      - store_artifacts:
          path: test-results/admin-browser
          destination: admin-browser
          when: always
  verify:
    environment:
      DATABASE_URL: postgresql://ci_fixture:ci_fixture@127.0.0.1:5432/newchanges_ci
    docker:
      - image: cimg/node:24.22
      - image: postgres:18-alpine
        environment:
          POSTGRES_USER: ci_fixture
          POSTGRES_PASSWORD: ci_fixture
          POSTGRES_DB: newchanges_ci
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Generate Prisma and build backend and frontend
          command: npm run build
          no_output_timeout: 10m
      - run:
          name: Prisma 7 disposable database integration
          command: node scripts/prisma-upgrade-integration.mjs
      - run:
          name: Disposable RLS cross-tenant negative-access probe
          command: CI_RLS_PROBE_APPROVED=CI_DISPOSABLE_ONLY node scripts/security/rls-isolation-ci-probe.mjs
      - run:
          name: Semantic integration and source safeguards
          command: |
            node scripts/production-boundary-check.mjs
            node scripts/portfolio-loading-check.mjs
            npm run check:contract
            npm run check:neon-egress
            npm run check:source-sync-safety
            node --max-old-space-size=192 --import tsx tests/bounded-source-feed.test.ts
            node --import tsx tests/interrupted-sync-recovery.test.ts
            npm run check:admin-ui
            node scripts/admin-refresh-clarity-check.mjs
            node scripts/dataset-replacement-preview-check.mjs
            npx tsx tests/dataset-replacement-approval.test.ts
            npx tsx tests/dataset-replacement-feed-budget.test.ts
            npx tsx tests/dataset-replacement-staging.test.ts
            npx tsx tests/dataset-replacement-staging-plan.test.ts
            npx tsx tests/dataset-replacement-object-integrity.test.ts
            npx tsx tests/dataset-replacement-manifest-review.test.ts
            npx tsx tests/dataset-replacement-storage-review.test.ts
            npx tsx tests/dataset-replacement-playground-store.test.ts
            npx tsx tests/dataset-replacement-transfer-budget.test.ts
            npx tsx tests/dataset-replacement-chronological-consumer.test.ts
            npx tsx tests/dataset-replacement-keyset-sql.test.ts
            npx tsx tests/canonical-schema-mapping.test.ts
            npx tsx tests/canonical-schema-discovery.test.ts
            npx tsx tests/canonical-mapped-keyset-sql.test.ts
            npx tsx tests/canonical-mapped-staging-runner.test.ts
            npx tsx tests/playground-mapped-staging-store.test.ts
            npx tsx tests/mapped-staging-recovery.test.ts
            npx tsx tests/playground-mysql-snapshot.test.ts
            npx tsx tests/ten-canonical-mapped-playground.test.ts
            npx tsx tests/canonical-mapped-row-validation.test.ts
            npx tsx tests/playground-mapped-import-rehearsal.test.ts
            npx tsx tests/isolated-cloud-page-sink.test.ts
            npx tsx tests/bounded-cloud-stage-http.test.ts
            npx tsx tests/fenced-staging-ledger.test.ts
            npx tsx tests/fenced-cloud-receipt-recorder.test.ts
            npx tsx tests/ten-feed-cutover-gate.test.ts
            npx tsx tests/testing-s3-smoke-guard.test.ts
            npx tsx tests/testing-cloud-mapped-rehearsal.test.ts
            npx tsx tests/mapped-staging-evidence.test.ts
            npx tsx tests/near-realtime-source-watch.test.ts
            npx tsx tests/source-watch-health.test.ts
            npx tsx tests/source-watermark-drift.test.ts
            npx tsx tests/sync-alert-policy.test.ts
            npx tsx tests/render-railway-pg-readonly-probe.test.ts
            node scripts/source-config-preservation-regression-check.mjs
            npx tsx tests/approved-mapped-rehearsal-cli.test.ts
            npx tsx tests/cloud-receipt-fencing-integration.test.ts
            npx tsx tests/playground-mysql-rehearsal-config.test.ts
            npx tsx tests/bounded-dimension-cache.test.ts
            npx tsx tests/monitoring-query-regression.test.ts
            node scripts/replacement-dependency-audit-check.mjs
            npx tsx tests/semantic-shadow-provenance.test.ts
            npm run check:semantic-planner
            node scripts/semantic-queue-batch-check.mjs
            npm run check:semantic-storage
            npm run check:source-vault
            npm run check:source-continuity
            npm run check:source-reconciliation
      - run:
          name: API, data and dashboard regressions
          command: |
            npm run check:production
            npm run check:security
            npm run check:ui
            npm run check:imports
            npm run check:scheduling
            npm run check:daily-refresh
            npm run check:enterprise-operations
            npm run check:unified-data-ingestion
            npm run check:enterprise-analytics-phase-2
            npm run check:react
            npm run check:role-perspective
      - run:
          name: Data quality, platform and UI tests
          command: |
            npm run test:score
            npm run check:brand
            npm run check:mlops
            npm run check:mlops-data-quality
            npm run check:accessibility
            npm run check:performance
            npm run check:security-identity
            npm run check:security-operations
            npm run check:security-governance
            npm run check:south-africa-compliance
            npm run check:period-comparison
      - run:
          name: Dependency vulnerability audit
          command: npm audit --audit-level=high
      - store_test_results:
          path: test-results
          when: always

  source_quality:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Install app and frontend dependencies
          command: npm ci --no-audit --no-fund && npm ci --prefix frontend --no-audit --no-fund && npm run db:generate
      - run:
          name: Install standalone quality tooling
          command: npm ls eslint @typescript-eslint/parser vitest @playwright/test
      - run:
          name: ESLint
          command: npm run quality:lint && node scripts/password-form-contract-check.mjs
      - run:
          name: TypeScript
          command: npm run quality:types
      - run:
          name: Vitest unit tests
          command: npm run quality:unit

  browser_smoke:
    docker:
      - image: mcr.microsoft.com/playwright:v1.64.1-noble
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Install app and frontend dependencies
          command: npm ci --no-audit --no-fund && npm ci --prefix frontend --no-audit --no-fund && npm run db:generate
      - run:
          name: Install Playwright
          command: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.64.1
      - run:
          name: Browser smoke test in Chromium
          command: npm run quality:e2e && node scripts/console-ux-browser-check.mjs && node scripts/header-responsive-check.mjs
      - store_artifacts:
          path: test-results
          destination: browser-smoke

  semgrep_security:
    docker:
      - image: python:3.12-slim
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Install Semgrep
          command: pip install --no-cache-dir semgrep
      - run:
          name: Scan JavaScript, TypeScript and security rules
          command: semgrep scan --config p/javascript --config p/typescript --config p/security-audit --error --exclude node_modules --exclude dist --exclude build .


  credential_exposure_scan:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Check secret scanner regression tests and tracked credential exposure
          command: node --test scripts/security/scan-secrets.test.mjs && node scripts/security/scan-secrets.mjs

  dependency_advisory_audit:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Report high severity dependency vulnerabilities separately
          command: node scripts/ci/audit-summary.mjs
      - store_artifacts:
          path: test-results/dependency-audit-summary.json
          destination: dependency-audit-summary.json
          when: always

  daily_security_repair:
    docker:
      - image: cimg/node:24.22
    resource_class: small
    working_directory: ~/newchanges
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Auto-fix non-breaking security vulnerabilities
          command: node scripts/ci/daily-security-fix.mjs
      - run:
          name: Install GitHub CLI
          command: |
            if type gh >/dev/null 2>&1; then exit 0; fi
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y gh
      - run:
          name: Open auto-fix PR if lockfile changed
          command: |
            if git diff --quiet package-lock.json package.json 2>/dev/null; then
              echo "[security-fix] No lockfile changes — nothing to commit."
              exit 0
            fi
            BRANCH="chunk/auto-security-fix-$(date +%Y%m%d)"
            git config user.email "security-bot@circleci"
            git config user.name "Security Bot"
            git checkout -b "$BRANCH"
            git add package-lock.json package.json
            git commit -m "fix(deps): auto-apply npm audit fix for security vulnerabilities $(date +%Y-%m-%d)"
            gh auth setup-git
            git push origin "$BRANCH"
            gh pr create \
              --title "fix(deps): auto security fix $(date +%Y-%m-%d)" \
              --body "Automatically generated by the daily security repair CI job.

            ## What changed
            Ran \`npm audit fix\` to apply non-breaking, semver-compatible dependency upgrades that resolve high or critical CVEs.

            ## Review checklist
            - [ ] Inspect changed packages in \`package-lock.json\`
            - [ ] Confirm CI passes on this branch before merging

            _Merge only after CI is green._" \
              --base main \
              --head "$BRANCH" \
              || echo "[security-fix] PR already exists or could not be created — skipping."
      - run:
          name: Credential exposure scan
          command: node --test scripts/security/scan-secrets.test.mjs && node scripts/security/scan-secrets.mjs
      - run:
          name: Dependency vulnerability audit report
          command: node scripts/ci/audit-summary.mjs || true
      - store_artifacts:
          path: test-results
          destination: daily-security
          when: always

workflows:
  semantic_context_readiness_check:
    when: << pipeline.parameters.semantic_context_readiness >>
    jobs:
      - semantic_testing_context_readiness:
          context: newchanges-neon-testing
  semantic_notification_rehearsal:
    when: << pipeline.parameters.semantic_notify_probe >>
    jobs:
      - semantic_testing_notify_probe:
          context: newchanges-neon-testing
  semantic_database_rehearsal:
    when: << pipeline.parameters.semantic_testing_e2e >>
    jobs:
      - semantic_testing_score_delta:
          context: newchanges-neon-testing
  verify_pull_requests_and_main:
    jobs:
      - verify
      - admin_browser_smoke
      - source_quality
      - browser_smoke
      - semgrep_security
      - credential_exposure_scan
      - dependency_advisory_audit

  # Runs daily on main: auto-fixes CVEs and opens a PR, plus re-scans for new findings.
  # Requires GITHUB_TOKEN in the newchanges-security CircleCI context.
  daily_security:
    triggers:
      - schedule:
          cron: "5 6 * * *"
          filters:
            branches:
              only:
                - main
    jobs:
      - daily_security_repair:
          context: newchanges-security
      - semgrep_security


